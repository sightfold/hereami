<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Here Am I</title>
    <style>
      :root {
        --bg: #fafafa;
        --card: #ffffff;
        --text: #18181b;
        --muted: #71717a;
        --line: #e4e4e7;
        --accent: #ca3e02;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0c0d;
          --card: #18181b;
          --text: #fafafa;
          --muted: #a1a1aa;
          --line: #27272a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 32px 24px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--card);
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        Check-in needs a connection so your time is recorded correctly. Try again once you have
        signal.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
